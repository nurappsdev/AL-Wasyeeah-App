name: al_wasyeah
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.14
  flutter_screenutil: ^5.9.3
  intl: 0.20.2
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  flutter_widget_from_html: ^0.15.3
  path_provider: ^2.1.5
  open_file: ^3.5.10
  http: ^1.2.2
  get: ^4.6.6
  fl_chart: ^0.69.2
  flutter_pdfview: ^1.4.0
  syncfusion_flutter_pdf:
  connectivity_plus: ^5.0.2
  fluttertoast: ^8.2.12
  dropdown_search: ^6.0.2
  file_picker: ^10.3.7
  flutter_html: ^3.0.0
  pretty_qr_code: ^3.5.0
  barcode_widget: ^2.0.4
  skeletonizer: ^2.1.3
  geolocator: ^14.0.2
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_html_to_pdf: ^3.0.0
  qr_flutter: ^4.1.0
  permission_handler: ^12.0.1
  mobile_scanner: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/app_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
